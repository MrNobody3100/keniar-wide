<div class="flex flex-col gap-6">

  <div class="flex items-center justify-end">
    <button id="open-add-realisation" class="bg-secondary text-on-secondary px-5 py-2.5 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
      <i class="ph ph-plus"></i> Ajouter une réalisation
    </button>
  </div>

  <div id="realisations-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    <!-- rendered by admin/js/realisations.js -->
  </div>

  <div id="realisations-empty" class="hidden flex-col items-center justify-center gap-4 py-20 px-6 text-center bg-surface-container-lowest rounded-2xl border border-outline-variant/10">
    <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
      <i class="ph ph-buildings text-3xl"></i>
    </div>
    <span class="font-headline font-semibold text-on-surface">Aucune réalisation publiée</span>
    <button onclick="openRealisationModal()" class="bg-secondary text-on-secondary px-6 py-3 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
      <i class="ph ph-plus"></i> Ajouter une réalisation
    </button>
  </div>
</div>

<!-- Add / Edit modal -->
<div id="realisation-modal" class="hidden modal-overlay">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant/10 sticky top-0 bg-surface-container-lowest z-10">
      <span id="realisation-modal-title" class="font-headline font-semibold text-on-surface text-lg">Ajouter une réalisation</span>
      <button onclick="closeRealisationModal()" class="text-on-surface-variant hover:text-on-surface p-1"><i class="ph ph-x text-xl"></i></button>
    </div>

    <form id="realisation-form" class="flex flex-col gap-5 p-6">
      <input type="hidden" id="realisation-id" />

      <div class="flex flex-col gap-2">
        <label class="text-xs font-label text-on-surface-variant uppercase">Photo du projet</label>
        <label id="realisation-image-dropzone" class="upload-dropzone">
          <img id="realisation-image-preview" class="hidden w-full max-h-48 object-contain rounded-lg" />
          <div id="realisation-image-placeholder" class="flex flex-col items-center gap-2">
            <i class="ph ph-image text-3xl"></i>
            <span class="text-sm">Cliquez pour ajouter une photo</span>
          </div>
          <input id="realisation-image-input" type="file" accept="image/*" class="hidden" />
        </label>
      </div>

      <div class="flex flex-col gap-2">
        <label for="realisation-title" class="text-xs font-label text-on-surface-variant uppercase">Titre du projet</label>
        <input id="realisation-title" required type="text" placeholder="Ex : Sécurisation siège social"
          class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="realisation-client" class="text-xs font-label text-on-surface-variant uppercase">Client</label>
          <input id="realisation-client" type="text" placeholder="Nom du client ou 'Client confidentiel'"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="realisation-category" class="text-xs font-label text-on-surface-variant uppercase">Catégorie</label>
          <select id="realisation-category" required class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary cursor-pointer">
            <!-- populated from Store.getCategories() -->
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="realisation-location" class="text-xs font-label text-on-surface-variant uppercase">Lieu</label>
          <input id="realisation-location" type="text" placeholder="Ex : Oran, Algérie"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="realisation-year" class="text-xs font-label text-on-surface-variant uppercase">Année</label>
          <input id="realisation-year" type="number" min="2000" max="2100" placeholder="2026"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="realisation-description" class="text-xs font-label text-on-surface-variant uppercase">Description</label>
        <textarea id="realisation-description" required rows="3" placeholder="Description courte du projet réalisé..."
          class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary resize-none"></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2 border-t border-outline-variant/10">
        <button type="button" onclick="closeRealisationModal()" class="px-5 py-2.5 rounded-xl text-sm font-headline font-semibold text-on-surface-variant hover:bg-surface-container-high transition-colors">
          Annuler
        </button>
        <button type="submit" class="bg-secondary text-on-secondary px-6 py-2.5 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
          <i class="ph ph-check"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirmation -->
<div id="realisation-delete-modal" class="hidden modal-overlay">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm p-6 flex flex-col gap-4">
    <div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
      <i class="ph ph-trash text-2xl"></i>
    </div>
    <div>
      <span class="font-headline font-semibold text-on-surface block">Supprimer cette réalisation ?</span>
      <span class="text-sm text-on-surface-variant">Cette action est irréversible.</span>
    </div>
    <div class="flex items-center justify-end gap-3">
      <button onclick="closeRealisationDeleteModal()" class="px-4 py-2.5 rounded-xl text-sm font-headline font-semibold text-on-surface-variant hover:bg-surface-container-high">Annuler</button>
      <button onclick="confirmDeleteRealisation()" class="bg-error text-on-error px-5 py-2.5 rounded-xl text-sm font-headline font-semibold hover:opacity-90">Supprimer</button>
    </div>
  </div>
</div>
