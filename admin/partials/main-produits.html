<div class="flex flex-col gap-6">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="relative w-full sm:w-80">
      <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant"></i>
      <input id="admin-product-search" type="text" placeholder="Rechercher un produit..."
        class="w-full bg-surface-container-lowest border border-outline-variant/20 text-on-surface text-sm pl-10 pr-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
    </div>
    <div class="flex items-center gap-3">
      <select id="admin-product-category-filter" class="bg-surface-container-lowest border border-outline-variant/20 text-on-surface text-sm px-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-secondary cursor-pointer">
        <option value="all">Toutes les catégories</option>
      </select>
      <button id="open-add-product" class="bg-secondary text-on-secondary px-5 py-2.5 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
        <i class="ph ph-plus"></i> Ajouter un produit
      </button>
    </div>
  </div>

  <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/10 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full admin-table text-sm">
        <thead>
          <tr class="text-left text-xs font-label text-on-surface-variant uppercase border-b border-outline-variant/10">
            <th class="px-6 py-4">Produit</th>
            <th class="px-6 py-4">Catégorie</th>
            <th class="px-6 py-4">Technologie</th>
            <th class="px-6 py-4">Prix</th>
            <th class="px-6 py-4">Stock</th>
            <th class="px-6 py-4">Statut</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="products-table-body" class="divide-y divide-outline-variant/10">
          <!-- rows rendered by admin/js/produits.js -->
        </tbody>
      </table>
    </div>

    <div id="products-empty" class="hidden flex-col items-center justify-center gap-4 py-20 px-6 text-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
        <i class="ph ph-package text-3xl"></i>
      </div>
      <div class="flex flex-col gap-1">
        <span class="font-headline font-semibold text-on-surface">Aucun produit dans le catalogue</span>
        <span class="text-sm text-on-surface-variant max-w-sm">Ajoutez votre premier produit pour qu'il apparaisse sur le catalogue public.</span>
      </div>
      <button onclick="openProductModal()" class="mt-2 bg-secondary text-on-secondary px-6 py-3 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
        <i class="ph ph-plus"></i> Ajouter un produit
      </button>
    </div>
  </div>
</div>

<!-- Add / Edit product modal -->
<div id="product-modal" class="hidden modal-overlay">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant/10 sticky top-0 bg-surface-container-lowest z-10">
      <span id="product-modal-title" class="font-headline font-semibold text-on-surface text-lg">Ajouter un produit</span>
      <button onclick="closeProductModal()" class="text-on-surface-variant hover:text-on-surface p-1"><i class="ph ph-x text-xl"></i></button>
    </div>

    <form id="product-form" class="flex flex-col gap-5 p-6">
      <input type="hidden" id="product-id" />

      <div class="flex flex-col gap-2">
        <label class="text-xs font-label text-on-surface-variant uppercase">Photo du produit</label>
        <label id="product-image-dropzone" class="upload-dropzone">
          <img id="product-image-preview" class="hidden w-full max-h-48 object-contain rounded-lg" />
          <div id="product-image-placeholder" class="flex flex-col items-center gap-2">
            <i class="ph ph-image text-3xl"></i>
            <span class="text-sm">Cliquez pour ajouter une photo</span>
          </div>
          <input id="product-image-input" type="file" accept="image/*" class="hidden" />
        </label>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="product-reference" class="text-xs font-label text-on-surface-variant uppercase">Référence</label>
          <input id="product-reference" required type="text" placeholder="Ex : KW-CAM-4K82"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="product-name" class="text-xs font-label text-on-surface-variant uppercase">Nom du produit</label>
          <input id="product-name" required type="text" placeholder="Ex : Caméra Dôme IP 4K"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label for="product-description" class="text-xs font-label text-on-surface-variant uppercase">Description</label>
        <textarea id="product-description" required rows="3" placeholder="Description technique courte du produit..."
          class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary resize-none"></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label for="product-category" class="text-xs font-label text-on-surface-variant uppercase">Catégorie</label>
          <select id="product-category" required class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary cursor-pointer">
            <!-- populated from Store.getCategories() -->
          </select>
        </div>
        <div class="flex flex-col gap-2">
          <label for="product-tech" class="text-xs font-label text-on-surface-variant uppercase">Technologie</label>
          <select id="product-tech" required class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary cursor-pointer">
            <option value="ip">IP / Numérique Haute Résolution</option>
            <option value="analogique">Analogique HD (TVI/AHD)</option>
            <option value="sans-fil">Radio Sans Fil cryptée</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="flex flex-col gap-2">
          <label for="product-price" class="text-xs font-label text-on-surface-variant uppercase">Prix (DZD)</label>
          <input id="product-price" required type="number" min="0" step="500"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="product-stock" class="text-xs font-label text-on-surface-variant uppercase">Quantité en stock</label>
          <input id="product-stock" required type="number" min="0" step="1"
            class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
        <div class="flex flex-col gap-2">
          <label for="product-availability" class="text-xs font-label text-on-surface-variant uppercase">Disponibilité</label>
          <select id="product-availability" class="bg-surface-container-high text-on-surface text-sm px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary cursor-pointer">
            <option value="en-stock">En Stock</option>
            <option value="sur-commande">Sur Commande</option>
            <option value="rupture">Rupture de Stock</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2 border-t border-outline-variant/10">
        <button type="button" onclick="closeProductModal()" class="px-5 py-2.5 rounded-xl text-sm font-headline font-semibold text-on-surface-variant hover:bg-surface-container-high transition-colors">
          Annuler
        </button>
        <button type="submit" class="bg-secondary text-on-secondary px-6 py-2.5 rounded-xl text-sm font-headline font-semibold hover:bg-[#164d9e] transition-all flex items-center gap-2">
          <i class="ph ph-check"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="hidden modal-overlay">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm p-6 flex flex-col gap-4">
    <div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
      <i class="ph ph-trash text-2xl"></i>
    </div>
    <div>
      <span class="font-headline font-semibold text-on-surface block">Supprimer ce produit ?</span>
      <span class="text-sm text-on-surface-variant">Cette action est irréversible.</span>
    </div>
    <div class="flex items-center justify-end gap-3">
      <button onclick="closeDeleteModal()" class="px-4 py-2.5 rounded-xl text-sm font-headline font-semibold text-on-surface-variant hover:bg-surface-container-high">Annuler</button>
      <button onclick="confirmDeleteProduct()" class="bg-error text-on-error px-5 py-2.5 rounded-xl text-sm font-headline font-semibold hover:opacity-90">Supprimer</button>
    </div>
  </div>
</div>
