<div class="flex flex-col gap-6">

  <div class="flex flex-wrap items-center gap-2">
    <button data-status-filter="all" class="devis-filter-tab bg-secondary text-on-secondary px-4 py-2 rounded-full text-sm font-headline font-semibold">Toutes</button>
    <button data-status-filter="nouveau" class="devis-filter-tab bg-surface-container-lowest text-on-surface-variant border border-outline-variant/20 px-4 py-2 rounded-full text-sm font-headline font-semibold hover:bg-surface-container-high">Nouvelles</button>
    <button data-status-filter="en-cours" class="devis-filter-tab bg-surface-container-lowest text-on-surface-variant border border-outline-variant/20 px-4 py-2 rounded-full text-sm font-headline font-semibold hover:bg-surface-container-high">En cours</button>
    <button data-status-filter="traite" class="devis-filter-tab bg-surface-container-lowest text-on-surface-variant border border-outline-variant/20 px-4 py-2 rounded-full text-sm font-headline font-semibold hover:bg-surface-container-high">Traitées</button>
  </div>

  <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/10 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full admin-table text-sm">
        <thead>
          <tr class="text-left text-xs font-label text-on-surface-variant uppercase border-b border-outline-variant/10">
            <th class="px-6 py-4">Client</th>
            <th class="px-6 py-4">Typologie</th>
            <th class="px-6 py-4">Équipements</th>
            <th class="px-6 py-4">Reçu</th>
            <th class="px-6 py-4">Statut</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="devis-table-body" class="divide-y divide-outline-variant/10">
          <!-- rendered by admin/js/devis.js -->
        </tbody>
      </table>
    </div>

    <div id="devis-empty" class="hidden flex-col items-center justify-center gap-4 py-20 px-6 text-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
        <i class="ph ph-file-text text-3xl"></i>
      </div>
      <span class="font-headline font-semibold text-on-surface">Aucune demande pour ce filtre</span>
      <span class="text-sm text-on-surface-variant max-w-sm">Les demandes envoyées depuis le configurateur "Devis sur Mesure" du site apparaîtront ici.</span>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div id="devis-detail-modal" class="hidden modal-overlay">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant/10 sticky top-0 bg-surface-container-lowest">
      <span class="font-headline font-semibold text-on-surface text-lg">Détail de la demande</span>
      <button onclick="closeDevisDetail()" class="text-on-surface-variant hover:text-on-surface p-1"><i class="ph ph-x text-xl"></i></button>
    </div>
    <div id="devis-detail-content" class="flex flex-col gap-5 p-6">
      <!-- populated by admin/js/devis.js -->
    </div>
  </div>
</div>
