<main class="w-full pt-20">
  <div class="max-w-7xl mx-auto px-6 lg:px-12 py-12 w-full">
    <div class="flex flex-col gap-2 mb-10 text-center max-w-2xl mx-auto">
      <span class="text-xs font-label text-secondary uppercase tracking-wide">Portfolio</span>
      <h1 class="font-headline font-bold text-on-surface text-3xl lg:text-4xl">Nos Réalisations</h1>
      <p class="text-on-surface-variant">
        Un aperçu des installations menées par nos équipes chez nos clients professionnels et institutionnels.
      </p>
    </div>

    <!-- Category filter tabs -->
    <div id="realisation-tabs" class="flex flex-wrap items-center justify-center gap-2 mb-10">
      <!-- Populated from Store.getCategories() by js/realisations.js -->
    </div>

    <div id="realisation-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Project cards are rendered here by js/realisations.js from data/realisations.js -->
    </div>

    <!-- Empty state -->
    <div id="realisation-empty" class="hidden flex-col items-center justify-center gap-4 bg-surface-container rounded-2xl py-20 px-6 text-center">
      <div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
        <i class="ph ph-buildings text-3xl"></i>
      </div>
      <div class="flex flex-col gap-1">
        <span class="font-headline font-semibold text-on-surface">Aucune réalisation publiée pour le moment</span>
        <span class="text-sm text-on-surface-variant max-w-sm">
          Nos projets réalisés seront ajoutés ici prochainement depuis l'espace admin.
        </span>
      </div>
    </div>
  </div>
</main>
