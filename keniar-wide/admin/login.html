<!DOCTYPE html>
<html lang="fr">
<head>
<!--
  This file is a REFERENCE only — copy its contents into the <head> of
  every page. Plain static HTML has no server-side includes, so each
  page embeds this block directly rather than fetching it at runtime.
  Keep the four files in sync if you edit design tokens.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap"
  rel="stylesheet"
/>

<!-- Phosphor Icons (CDN) -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

<!-- Tailwind CDN (utility classes) + Keniar Wide design tokens -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          surface: "#0d1b2a",
          "surface-dim": "#081420",
          "surface-bright": "#16283c",
          "surface-container-lowest": "#060d16",
          "surface-container-low": "#0f2032",
          "surface-container": "#132a40",
          "surface-container-high": "#1a3450",
          "surface-container-highest": "#213f5e",
          "on-surface": "#eef3f7",
          "on-surface-variant": "#9fb0c2",
          "inverse-surface": "#eef3f7",
          "inverse-on-surface": "#0d1b2a",
          outline: "#3d5468",
          "outline-variant": "#25384a",
          primary: "#f9a026",
          "on-primary": "#1c1300",
          "primary-container": "#3a2a0f",
          "on-primary-container": "#ffd28f",
          secondary: "#2f7dd9",
          "on-secondary": "#ffffff",
          "secondary-container": "#123a63",
          "on-secondary-container": "#bcd9ff",
          tertiary: "#d9860f",
          "on-tertiary": "#241800",
          "tertiary-container": "#3a2a10",
          "on-tertiary-container": "#f7c877",
          error: "#ff5449",
          "on-error": "#690005",
          "error-container": "#93000a",
          "on-error-container": "#ffdad6",
          background: "#0d1b2a",
          "on-background": "#eef3f7",
          "surface-variant": "#25384a",
        },
        fontFamily: {
          headline: ["Plus Jakarta Sans", "sans-serif"],
          body: ["Inter", "sans-serif"],
          label: ["JetBrains Mono", "monospace"],
        },
        borderRadius: {
          sm: "0.25rem",
          DEFAULT: "0.5rem",
          md: "0.75rem",
          lg: "1rem",
          xl: "1.5rem",
          full: "9999px",
        },
      },
    },
  };
</script>

<!-- Site styles (tokens + custom rules layered on top of Tailwind) -->
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/admin.css" />

    <title>Connexion Admin | EURL Keniar Wide</title>
    <meta name="robots" content="noindex, nofollow" />
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center px-6">

  <div class="w-full max-w-md flex flex-col gap-8">
    <div class="flex flex-col items-center gap-3 text-center">
      <img src="/assets/images/logo/keniar-logo.png" alt="EURL Keniar Wide" class="h-16 w-16 object-contain rounded-2xl shadow-lg" />
      <div>
        <h1 class="font-headline font-bold text-on-surface text-2xl">Espace Admin</h1>
        <p class="text-on-surface-variant text-sm">EURL Keniar Wide — Gestion du catalogue &amp; des demandes</p>
      </div>
    </div>

    <form id="login-form" class="flex flex-col gap-4 bg-surface-container-lowest p-8 rounded-2xl shadow-xl border border-outline-variant/20">
      <div class="flex flex-col gap-2">
        <label for="username" class="text-xs font-label text-on-surface-variant uppercase">Identifiant</label>
        <div class="relative">
          <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant"></i>
          <input id="username" name="username" type="text" required autocomplete="username"
            class="w-full bg-surface-container-high text-on-surface text-sm pl-11 pr-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <label for="password" class="text-xs font-label text-on-surface-variant uppercase">Mot de passe</label>
        <div class="relative">
          <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant"></i>
          <input id="password" name="password" type="password" required autocomplete="current-password"
            class="w-full bg-surface-container-high text-on-surface text-sm pl-11 pr-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-secondary" />
        </div>
      </div>

      <p id="login-error" class="hidden text-sm text-error flex items-center gap-2">
        <i class="ph-fill ph-warning-circle"></i> <span id="login-error-text">Identifiant ou mot de passe incorrect.</span>
      </p>

      <button id="login-submit" type="submit" class="mt-2 bg-secondary text-on-secondary px-6 py-3.5 rounded-xl font-headline font-semibold hover:bg-[#2468b3] transition-all flex items-center justify-center gap-2">
        Se connecter <i class="ph ph-arrow-right"></i>
      </button>
    </form>

    <a href="/index.html" class="text-center text-sm text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-2">
      <i class="ph ph-arrow-left"></i> Retour au site public
    </a>
  </div>

  <script src="/admin/js/login.js"></script>
</body>
</html>
